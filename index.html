<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Bot Dashboard</title>

    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel für JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        discord: {
                            bg: '#313338',
                            sidebar: '#2b2d31',
                            accent: '#5865F2',
                            accentHover: '#4752C4',
                            950: '#111214',
                            900: '#1e1f22',
                            800: '#232428',
                            700: '#383a40',
                            600: '#404249',
                            500: '#80848e',
                            400: '#949ba4',
                            300: '#b5bac1'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { margin: 0; font-family: 'Inter', sans-serif; background-color: #313338; color: white; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const CLIENT_ID = "1533341142119088229";
        const REDIRECT_URI = encodeURIComponent("https://server-satus.vercel.app/");
        const SCOPES = "identify+email+guilds";
        const OAUTH_URL = `https://discord.com/oauth2/authorize?client_id=${CLIENT_ID}&response_type=token&redirect_uri=${REDIRECT_URI}&scope=${SCOPES}`;

        // --- Shared Components ---
        const Card = ({ title, children, className = "" }) => (
            <div className={`bg-discord-sidebar rounded-lg border border-discord-800 p-6 ${className}`}>
                {title && <h3 className="text-lg font-bold text-white mb-4 border-b border-discord-800 pb-2">{title}</h3>}
                {children}
            </div>
        );

        const StatBox = ({ label, value, iconClass }) => (
            <div className="bg-discord-900 rounded-md p-4 flex items-center justify-between border border-discord-800">
                <div>
                    <p className="text-discord-500 text-xs font-semibold uppercase mb-1">{label}</p>
                    <p className="text-2xl font-bold text-white">{value}</p>
                </div>
                <div className="text-discord-accent bg-discord-950 p-3 rounded-full flex items-center justify-center">
                    <i data-lucide={iconClass}></i>
                </div>
            </div>
        );

        // --- Pages ---
        const ServerSelectionPage = ({ guilds, onSelectServer }) => {
            const inviteBot = (guildId, e) => {
                e.stopPropagation();
                const inviteUrl = `https://discord.com/oauth2/authorize?client_id=${CLIENT_ID}&permissions=8&integration_type=0&scope=bot+applications.commands&guild_id=${guildId}`;
                window.open(inviteUrl, '_blank', 'width=500,height=700');
            };

            return (
                <div className="space-y-6">
                    <div>
                        <h2 className="text-2xl font-bold text-white">Server Auswahl</h2>
                        <p className="text-discord-500 mt-1">Wähle einen Server aus, den du verwalten möchtest. Du siehst hier alle Server, auf denen du Administrator bist.</p>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                        {guilds.length === 0 ? (
                            <div className="col-span-full flex flex-col items-center justify-center py-12 bg-discord-sidebar rounded-lg border border-discord-800">
                                <i data-lucide="server-off" className="w-12 h-12 text-discord-600 mb-3"></i>
                                <p className="text-discord-500">Keine Server gefunden oder Berechtigungen fehlen.</p>
                            </div>
                        ) : (
                            guilds.map(guild => (
                                <div key={guild.id} onClick={() => onSelectServer(guild)} className="bg-discord-sidebar rounded-lg border border-discord-800 hover:border-discord-accent transition-colors cursor-pointer overflow-hidden group flex flex-col">
                                    <div className="h-24 bg-discord-900 relative">
                                        <div className="absolute inset-0 opacity-20 bg-gradient-to-br from-discord-accent to-purple-600"></div>
                                        <div className="absolute -bottom-6 left-6 w-16 h-16 rounded-full border-4 border-discord-sidebar bg-discord-800 flex items-center justify-center overflow-hidden">
                                            {guild.icon ? (
                                                <img src={`https://cdn.discordapp.com/icons/${guild.id}/${guild.icon}.png`} alt={guild.name} className="w-full h-full object-cover" />
                                            ) : (
                                                <span className="text-white font-bold text-xl">{guild.name.charAt(0)}</span>
                                            )}
                                        </div>
                                    </div>
                                    <div className="pt-8 pb-4 px-6 flex flex-col flex-1">
                                        <h3 className="text-lg font-bold text-white truncate mb-4">{guild.name}</h3>
                                        <div className="mt-auto flex gap-2">
                                            <button className="flex-1 bg-discord-800 hover:bg-discord-700 text-white py-2 rounded text-sm font-medium transition">
                                                Verwalten
                                            </button>
                                            <button 
                                                onClick={(e) => inviteBot(guild.id, e)}
                                                className="bg-discord-accent hover:bg-discord-accentHover text-white px-3 py-2 rounded text-sm font-medium transition flex items-center justify-center"
                                                title="Bot zu diesem Server einladen"
                                            >
                                                <i data-lucide="user-plus" className="w-4 h-4"></i>
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            ))
                        )}
                    </div>
                </div>
            );
        };

        const OverviewPage = ({ server }) => {
            return (
                <div className="space-y-6">
                    <div className="flex justify-between items-center bg-discord-sidebar p-4 rounded-lg border border-discord-800">
                        <div className="flex items-center gap-4">
                            {server?.icon ? (
                                <img src={`https://cdn.discordapp.com/icons/${server.id}/${server.icon}.png`} className="w-12 h-12 rounded-full" />
                            ) : (
                                <div className="w-12 h-12 rounded-full bg-discord-800 flex items-center justify-center text-white font-bold text-xl">
                                    {server?.name?.charAt(0)}
                                </div>
                            )}
                            <div>
                                <h2 className="text-xl font-bold text-white">{server?.name || "Unbekannter Server"}</h2>
                                <p className="text-discord-500 text-sm">Server ID: {server?.id}</p>
                            </div>
                        </div>
                        <button className="bg-discord-accent hover:bg-discord-accentHover text-white px-4 py-2 rounded transition font-medium flex items-center gap-2">
                            <i data-lucide="refresh-cw" className="w-4 h-4"></i> Sync
                        </button>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <StatBox label="Mitglieder" value="1,248" iconClass="users" />
                        <StatBox label="Kanäle" value="24" iconClass="hash" />
                        <StatBox label="Rollen" value="12" iconClass="shield" />
                    </div>

                    <Card title="Recent Activity Logs">
                        <div className="space-y-3 text-sm">
                            <div className="flex items-center justify-between p-2 bg-discord-900 rounded border border-discord-800">
                                <span className="text-discord-300">Bot verbunden mit Server</span>
                                <span className="text-xs text-discord-500">Gerade eben</span>
                            </div>
                            <div className="flex items-center justify-between p-2 bg-discord-900 rounded border border-discord-800">
                                <span className="text-discord-300">Auto-Mod Modul initialisiert</span>
                                <span className="text-xs text-discord-500">Vor 5 Min</span>
                            </div>
                        </div>
                    </Card>
                </div>
            );
        };

        const ModulesPage = ({ server }) => (
            <div className="space-y-6">
                <h2 className="text-2xl font-bold text-white">Module für {server?.name}</h2>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <Card title="Willkommensnachrichten">
                        <p className="text-discord-500 text-sm mb-4">Sende automatisch eine Nachricht, wenn ein neuer Benutzer beitritt.</p>
                        <div className="flex justify-between items-center mt-4 pt-4 border-t border-discord-800">
                            <span className="text-sm font-medium">Status</span>
                            <span className="bg-green-500/10 text-green-400 px-2 py-1 rounded text-xs font-bold border border-green-500/20">Aktiviert</span>
                        </div>
                    </Card>
                    <Card title="Auto-Moderation">
                        <p className="text-discord-500 text-sm mb-4">Filtere automatisch Spam und unerwünschte Links aus.</p>
                        <div className="flex justify-between items-center mt-4 pt-4 border-t border-discord-800">
                            <span className="text-sm font-medium">Status</span>
                            <span className="bg-red-500/10 text-red-400 px-2 py-1 rounded text-xs font-bold border border-red-500/20">Deaktiviert</span>
                        </div>
                    </Card>
                </div>
            </div>
        );

        const SettingsPage = () => {
            const [showSecret, setShowSecret] = useState(false);
            const [showToken, setShowToken] = useState(false);

            return (
                <div>
                    <h2 className="text-2xl font-bold text-white mb-6">Globale Bot Einstellungen & API Keys</h2>
                    
                    <Card>
                        <form className="space-y-6" onSubmit={(e) => e.preventDefault()}>
                            <div>
                                <label className="block text-xs font-bold text-discord-500 uppercase tracking-wider mb-2">Bot Token</label>
                                <div className="flex gap-2">
                                    <input 
                                        type={showToken ? "text" : "password"}
                                        className="flex-1 bg-discord-900 text-discord-300 rounded p-3 focus:outline-none focus:ring-2 focus:ring-discord-accent border border-discord-800 font-mono text-sm"
                                        defaultValue="MTUzMzM0MTE0MjExOTA4ODIyOQ.GuLNmj.wjDVJ0rGdxyEyGAoAZXNjNmSEJ9KiGg4kzCYnY"
                                        readOnly
                                    />
                                    <button 
                                        type="button" 
                                        onClick={() => setShowToken(!showToken)}
                                        className="bg-discord-800 hover:bg-discord-700 px-4 rounded text-white font-medium text-sm"
                                    >
                                        {showToken ? "Verbergen" : "Anzeigen"}
                                    </button>
                                </div>
                            </div>
                            
                            <div>
                                <label className="block text-xs font-bold text-discord-500 uppercase tracking-wider mb-2">Client ID</label>
                                <input 
                                    type="text" 
                                    className="w-full bg-discord-900 text-discord-300 rounded p-3 focus:outline-none border border-discord-800 font-mono text-sm"
                                    defaultValue="1533341142119088229"
                                    readOnly
                                />
                            </div>

                            <div>
                                <label className="block text-xs font-bold text-discord-500 uppercase tracking-wider mb-2">Client Secret</label>
                                <div className="flex gap-2">
                                    <input 
                                        type={showSecret ? "text" : "password"}
                                        className="flex-1 bg-discord-900 text-discord-300 rounded p-3 focus:outline-none border border-discord-800 font-mono text-sm"
                                        defaultValue="_-8aRmylaPORmjGdSno-OTWYrrdqrE3s"
                                        readOnly
                                    />
                                    <button 
                                        type="button" 
                                        onClick={() => setShowSecret(!showSecret)}
                                        className="bg-discord-800 hover:bg-discord-700 px-4 rounded text-white font-medium text-sm"
                                    >
                                        {showSecret ? "Verbergen" : "Anzeigen"}
                                    </button>
                                </div>
                            </div>

                            <div className="flex justify-end pt-4">
                                <button className="bg-discord-accent hover:bg-discord-accentHover text-white px-6 py-2 rounded font-medium transition">
                                    Änderungen speichern
                                </button>
                            </div>
                        </form>
                    </Card>
                </div>
            );
        };

        const App = () => {
            const [activeTab, setActiveTab] = useState('servers');
            const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
            
            const [isAuthenticated, setIsAuthenticated] = useState(false);
            const [user, setUser] = useState(null);
            const [guilds, setGuilds] = useState([]);
            const [selectedServer, setSelectedServer] = useState(null);

            useEffect(() => {
                // Parse URL hash for Discord OAuth Token
                const hashParams = new URLSearchParams(window.location.hash.substring(1));
                const token = hashParams.get('access_token');
                
                if (token) {
                    setIsAuthenticated(true);
                    window.history.replaceState({}, document.title, window.location.pathname);

                    // Fetch Discord user info
                    fetch('https://discord.com/api/users/@me', {
                        headers: { Authorization: `Bearer ${token}` }
                    })
                    .then(res => res.json())
                    .then(data => {
                        if (data && data.id) {
                            setUser(data);
                        } else {
                            setUser({ username: "DiscordAdmin", global_name: "Admin User", id: "123456789" });
                        }
                    })
                    .catch(() => {
                        setUser({ username: "DiscordAdmin", global_name: "Admin User", id: "123456789" });
                    });

                    // Fetch user guilds
                    fetch('https://discord.com/api/users/@me/guilds', {
                        headers: { Authorization: `Bearer ${token}` }
                    })
                    .then(res => res.json())
                    .then(data => {
                        if (Array.isArray(data)) {
                            const adminGuilds = data.filter(g => 
                                g.owner || (g.permissions & 0x8) === 0x8 || (g.permissions & 0x20) === 0x20
                            );
                            setGuilds(adminGuilds.length > 0 ? adminGuilds : getMockGuilds());
                        } else {
                            setGuilds(getMockGuilds());
                        }
                    })
                    .catch(() => {
                        setGuilds(getMockGuilds());
                    });
                }
            }, []);

            const getMockGuilds = () => [
                { id: "987654321", name: "Gaming Community DE", icon: null, owner: true, permissions: 8 },
                { id: "112233445", name: "Entwickler Lounge", icon: null, owner: false, permissions: 8 },
                { id: "554433221", name: "Freunde & Chill", icon: null, owner: true, permissions: 8 }
            ];

            const loginAsDemo = () => {
                setIsAuthenticated(true);
                setUser({ username: "BotMaster", global_name: "Server Owner", id: "9988776655" });
                setGuilds(getMockGuilds());
            };

            useEffect(() => {
                lucide.createIcons();
            });

            const navItems = selectedServer ? [
                { id: 'servers', label: 'Zurück zur Auswahl', icon: 'arrow-left' },
                { id: 'overview', label: 'Server Übersicht', icon: 'layout-dashboard' },
                { id: 'modules', label: 'Server Module', icon: 'blocks' },
                { id: 'settings', label: 'Bot Einstellungen', icon: 'settings' },
            ] : [
                { id: 'servers', label: 'Meine Server', icon: 'server' },
                { id: 'settings', label: 'Globale Einstellungen', icon: 'settings' },
            ];

            const handleNavClick = (id) => {
                if (id === 'servers') setSelectedServer(null);
                setActiveTab(id);
                setIsMobileMenuOpen(false);
            };

            const renderContent = () => {
                if (activeTab === 'servers') return <ServerSelectionPage guilds={guilds} onSelectServer={(s) => { setSelectedServer(s); setActiveTab('overview'); }} />;
                if (activeTab === 'settings') return <SettingsPage />;
                
                if (selectedServer) {
                    switch(activeTab) {
                        case 'overview': return <OverviewPage server={selectedServer} />;
                        case 'modules': return <ModulesPage server={selectedServer} />;
                        default: return <OverviewPage server={selectedServer} />;
                    }
                }
                return null;
            };

            if (!isAuthenticated) return (
                <div className="min-h-screen bg-discord-bg flex flex-col items-center justify-center p-4">
                    <div className="bg-discord-sidebar p-8 rounded-lg shadow-xl max-w-md w-full text-center border border-discord-800">
                        <div className="w-20 h-20 bg-discord-900 rounded-full mx-auto mb-6 flex items-center justify-center shadow-inner">
                            <i data-lucide="bot" className="w-10 h-10 text-discord-accent"></i>
                        </div>
                        <h1 className="text-2xl font-bold text-white mb-2">Bot Dashboard</h1>
                        <p className="text-discord-500 mb-6">Bitte melde dich mit deinem Discord-Account an, um Zugriff auf deine Server zu erhalten.</p>
                        
                        <div className="space-y-3">
                            <a 
                                href={OAUTH_URL}
                                className="w-full flex items-center justify-center gap-3 bg-discord-accent hover:bg-discord-accentHover text-white py-3 px-4 rounded-md font-medium transition-colors"
                            >
                                <i data-lucide="log-in" className="w-5 h-5"></i>
                                Mit Discord anmelden
                            </a>
                            
                            <button 
                                onClick={loginAsDemo}
                                className="w-full flex items-center justify-center gap-3 bg-discord-800 hover:bg-discord-700 text-discord-300 hover:text-white py-2.5 px-4 rounded-md font-medium transition-colors text-sm border border-discord-700"
                            >
                                <i data-lucide="play-circle" className="w-4 h-4 text-green-400"></i>
                                Direkt im Demo-Modus starten
                            </button>
                        </div>
                    </div>
                </div>
            );

            return (
                <div className="flex h-screen bg-discord-bg overflow-hidden">
                    {/* Mobile Sidebar Overlay */}
                    {isMobileMenuOpen && (
                        <div 
                            className="fixed inset-0 bg-black/50 z-10 md:hidden" 
                            onClick={() => setIsMobileMenuOpen(false)}
                        />
                    )}

                    {/* Sidebar */}
                    <aside className={`fixed md:relative bg-discord-sidebar w-64 h-full flex-shrink-0 flex flex-col transition-transform duration-300 z-20 ${isMobileMenuOpen ? 'translate-x-0' : '-translate-x-full md:translate-x-0'}`}>
                        <div className="h-16 flex items-center px-6 border-b border-discord-800 flex-shrink-0">
                            <div className="w-8 h-8 bg-discord-accent rounded-lg flex items-center justify-center mr-3">
                                <i data-lucide="bot" className="text-white w-5 h-5"></i>
                            </div>
                            <h1 className="text-white font-bold text-lg">Bot Control</h1>
                            <button className="md:hidden ml-auto text-discord-500 hover:text-white" onClick={() => setIsMobileMenuOpen(false)}>
                                <i data-lucide="x" className="w-5 h-5"></i>
                            </button>
                        </div>
                        
                        <div className="flex-1 overflow-y-auto py-4">
                            {selectedServer && (
                                <div className="px-4 mb-4">
                                    <div className="bg-discord-900 rounded border border-discord-800 p-3 flex items-center gap-3">
                                        {selectedServer.icon ? (
                                            <img src={`https://cdn.discordapp.com/icons/${selectedServer.id}/${selectedServer.icon}.png`} className="w-8 h-8 rounded-full" />
                                        ) : (
                                            <div className="w-8 h-8 rounded-full bg-discord-700 flex flex-shrink-0 items-center justify-center text-xs font-bold text-white">
                                                {selectedServer.name.charAt(0)}
                                            </div>
                                        )}
                                        <span className="text-white font-medium text-sm truncate">{selectedServer.name}</span>
                                    </div>
                                </div>
                            )}

                            <nav className="space-y-1 px-3">
                                {navItems.map(item => (
                                    <button
                                        key={item.id}
                                        onClick={() => handleNavClick(item.id)}
                                        className={`w-full flex items-center px-3 py-2.5 text-sm font-medium rounded-md transition-colors ${
                                            activeTab === item.id 
                                                ? 'bg-discord-800 text-white' 
                                                : 'text-discord-500 hover:bg-discord-800/50 hover:text-gray-300'
                                        }`}
                                    >
                                        <i data-lucide={item.icon} className="mr-3 w-5 h-5"></i>
                                        {item.label}
                                    </button>
                                ))}
                            </nav>
                        </div>

                        {/* User Profile Area */}
                        <div className="p-4 bg-discord-900 border-t border-discord-800">
                            <div className="flex items-center">
                                <div className="w-10 h-10 rounded-full bg-discord-800 overflow-hidden flex items-center justify-center text-white flex-shrink-0">
                                    {user?.avatar ? (
                                        <img src={`https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png`} alt="Avatar" className="w-full h-full object-cover" />
                                    ) : (
                                        <i data-lucide="user" className="w-5 h-5"></i>
                                    )}
                                </div>
                                <div className="ml-3 truncate">
                                    <p className="text-sm font-bold text-white truncate">{user?.global_name || user?.username || "Benutzer"}</p>
                                    <p className="text-xs text-discord-500 truncate">{user?.username ? `@${user.username}` : "Online"}</p>
                                </div>
                                <button 
                                    className="ml-auto p-2 text-discord-500 hover:text-red-400 transition-colors"
                                    title="Abmelden"
                                    onClick={() => {
                                        setIsAuthenticated(false);
                                        setUser(null);
                                        setGuilds([]);
                                        setSelectedServer(null);
                                        window.location.hash = '';
                                    }}
                                >
                                    <i data-lucide="log-out" className="w-4 h-4"></i>
                                </button>
                            </div>
                        </div>
                    </aside>

                    {/* Main Content */}
                    <main className="flex-1 flex flex-col min-w-0">
                        {/* Mobile Header */}
                        <header className="md:hidden h-16 bg-discord-sidebar border-b border-discord-800 flex items-center px-4 flex-shrink-0">
                            <button className="text-discord-500 hover:text-white" onClick={() => setIsMobileMenuOpen(true)}>
                                <i data-lucide="menu" className="w-6 h-6"></i>
                            </button>
                            <span className="ml-4 font-bold text-white">Bot Dashboard</span>
                        </header>

                        {/* Content Area */}
                        <div className="flex-1 overflow-auto p-4 md:p-8">
                            <div className="max-w-6xl mx-auto">
                                {renderContent()}
                            </div>
                        </div>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
