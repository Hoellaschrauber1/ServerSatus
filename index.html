<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Bot Dashboard</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel for in-browser JSX compilation (only for dev/demo purposes) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Lucide Icons (React version) -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        discord: {
                            100: '#f2f3f5',
                            200: '#ebedef',
                            300: '#e3e5e8',
                            400: '#d1d3d6',
                            500: '#b9bbbe',
                            600: '#8e9297',
                            700: '#72767d',
                            800: '#4f545c',
                            900: '#36393f',
                            950: '#2f3136',
                            bg: '#36393f',
                            sidebar: '#2f3136',
                            accent: '#5865F2',
                            accentHover: '#4752C4'
                        }
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            background-color: #36393f;
            color: #dcddde;
            font-family: 'gg sans', 'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }
        
        /* Custom scrollbar to match Discord style */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #2f3136; 
        }
        ::-webkit-scrollbar-thumb {
            background: #202225; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #18191c; 
        }
    </style>
</head>
<body>
    <!-- Root element for React -->
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const OAUTH_URL = "https://discord.com/oauth2/authorize?client_id=1533341142119088229&response_type=code&redirect_uri=https%3A%2F%2Fserver-satus.vercel.app%2F&scope=identify+email+guilds.join+guilds+gdm.join+rpc.notifications.read+rpc.video.read+rpc.screenshare.write+messages.read+applications.store.update+openid+applications.commands.permissions.update+applications.builds.read+rpc.activities.write+rpc.video.write+rpc.voice.read+connections+guilds.members.read+role_connections.write+rpc+rpc.voice.write+rpc.screenshare.read";

        // --- Shared Components ---
        
        const Card = ({ title, children, className = "" }) => (
            <div className={`bg-discord-sidebar rounded-lg shadow-md p-6 ${className}`}>
                {title && <h3 className="text-lg font-bold text-white mb-4 uppercase tracking-wider text-sm">{title}</h3>}
                {children}
            </div>
        );

        const StatBox = ({ label, value, iconClass }) => (
            <div className="bg-discord-900 rounded-md p-4 flex items-center justify-between border border-discord-800">
                <div>
                    <p className="text-discord-500 text-xs font-semibold uppercase mb-1">{label}</p>
                    <p className="text-2xl font-bold text-white">{value}</p>
                </div>
                <div className="text-discord-accent bg-discord-950 p-3 rounded-full">
                    <i data-lucide={iconClass}></i>
                </div>
            </div>
        );

        // --- Pages ---

        const LoginPage = () => {
            useEffect(() => {
                lucide.createIcons();
            }, []);

            return (
                <div className="min-h-screen bg-discord-bg flex items-center justify-center p-4">
                    <div className="bg-discord-sidebar p-8 rounded-lg shadow-xl max-w-md w-full text-center border border-discord-800">
                        <div className="w-20 h-20 bg-discord-900 rounded-full mx-auto mb-6 flex items-center justify-center shadow-inner">
                            <i data-lucide="bot" className="w-10 h-10 text-discord-accent"></i>
                        </div>
                        <h1 className="text-2xl font-bold text-white mb-2">Bot Dashboard</h1>
                        <p className="text-discord-500 mb-8">Bitte melde dich mit deinem Discord-Account an, um Zugriff auf die Verwaltung zu erhalten.</p>
                        <a 
                            href={OAUTH_URL}
                            className="w-full flex items-center justify-center gap-3 bg-discord-accent hover:bg-discord-accentHover text-white py-3 px-4 rounded-md font-medium transition-colors"
                        >
                            <i data-lucide="log-in" className="w-5 h-5"></i>
                            Mit Discord anmelden
                        </a>
                    </div>
                </div>
            );
        };

        const OverviewPage = () => {
            const [stats, setStats] = useState({ servers: 0, users: 0, uptime: "-", ping: "-" });
            const [logs, setLogs] = useState([]);

            useEffect(() => {
                lucide.createIcons();
            }, []);

            return (
                <div className="space-y-6">
                    <div className="flex justify-between items-center">
                        <h2 className="text-2xl font-bold text-white">Dashboard Overview</h2>
                        <button className="bg-discord-accent hover:bg-discord-accentHover text-white px-4 py-2 rounded transition font-medium flex items-center gap-2">
                            <i data-lucide="refresh-cw" className="w-4 h-4"></i> Aktualisieren
                        </button>
                    </div>

                    {/* Stats Grid */}
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                        <StatBox label="Servers" value={stats.servers} iconClass="server" />
                        <StatBox label="Users" value={stats.users} iconClass="users" />
                        <StatBox label="Uptime" value={stats.uptime} iconClass="clock" />
                        <StatBox label="Ping" value={stats.ping} iconClass="activity" />
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        {/* Status Panel */}
                        <Card title="Bot Status" className="lg:col-span-1">
                            <div className="flex flex-col items-center p-4">
                                <div className="w-24 h-24 rounded-full bg-discord-900 border-4 border-discord-600 mb-4 flex items-center justify-center relative">
                                    <i data-lucide="bot" className="w-10 h-10 text-discord-600"></i>
                                </div>
                                <h3 className="text-xl font-bold text-white">Wartet auf Daten...</h3>
                                <p className="text-discord-500 mb-6">Status unbekannt</p>
                                
                                <div className="w-full space-y-3">
                                    <button className="w-full bg-discord-800 text-discord-600 py-2 rounded font-medium transition cursor-not-allowed" disabled>
                                        Stop Bot
                                    </button>
                                    <button className="w-full bg-discord-800 text-discord-600 py-2 rounded font-medium transition cursor-not-allowed" disabled>
                                        Restart Bot
                                    </button>
                                </div>
                            </div>
                        </Card>

                        {/* Logs Panel */}
                        <Card title="Recent Activity Logs" className="lg:col-span-2">
                            <div className="space-y-3">
                                {logs.length > 0 ? logs.map(log => (
                                    <div key={log.id} className="flex items-start p-3 bg-discord-900 rounded border-l-4">
                                        <div className="flex-1">
                                            <p className="text-sm text-gray-200">{log.message}</p>
                                        </div>
                                    </div>
                                )) : (
                                    <div className="flex flex-col items-center justify-center py-8 text-discord-600">
                                        <i data-lucide="inbox" className="w-10 h-10 mb-2 opacity-50"></i>
                                        <p>Keine Logs vorhanden.</p>
                                    </div>
                                )}
                            </div>
                        </Card>
                    </div>
                </div>
            );
        };

        const ModulesPage = () => {
            const [modules, setModules] = useState([
                { id: 'welcome', name: 'Welcome Messages', description: 'Send messages when users join or leave.', enabled: true },
                { id: 'mod', name: 'Moderation', description: 'Kick, ban, mute, and filter bad words.', enabled: true },
                { id: 'music', name: 'Music Player', description: 'Play music in voice channels.', enabled: false },
                { id: 'economy', name: 'Economy System', description: 'Global economy with shop and inventory.', enabled: false },
                { id: 'tickets', name: 'Ticket System', description: 'Allow users to create support tickets.', enabled: true },
            ]);

            const toggleModule = (id) => {
                setModules(modules.map(mod => 
                    mod.id === id ? { ...mod, enabled: !mod.enabled } : mod
                ));
            };

            return (
                <div>
                    <h2 className="text-2xl font-bold text-white mb-6">Module Configuration</h2>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        {modules.map(mod => (
                            <Card key={mod.id} className="flex flex-col justify-between h-full">
                                <div>
                                    <div className="flex justify-between items-start mb-2">
                                        <h3 className="text-lg font-bold text-white">{mod.name}</h3>
                                        <label className="relative inline-flex items-center cursor-pointer">
                                            <input 
                                                type="checkbox" 
                                                className="sr-only peer" 
                                                checked={mod.enabled}
                                                onChange={() => toggleModule(mod.id)}
                                            />
                                            <div className="w-11 h-6 bg-discord-800 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-discord-accent"></div>
                                        </label>
                                    </div>
                                    <p className="text-discord-500 text-sm mb-4">{mod.description}</p>
                                </div>
                                <div>
                                    <button 
                                        className={`w-full py-2 rounded text-sm font-medium transition ${mod.enabled ? 'bg-discord-800 hover:bg-discord-700 text-white' : 'bg-discord-900 text-discord-600 cursor-not-allowed'}`}
                                        disabled={!mod.enabled}
                                    >
                                        Configure Settings
                                    </button>
                                </div>
                            </Card>
                        ))}
                    </div>
                </div>
            );
        };

        const SettingsPage = () => (
            <div>
                <h2 className="text-2xl font-bold text-white mb-6">Bot Settings</h2>
                <Card>
                    <form className="space-y-6" onSubmit={(e) => e.preventDefault()}>
                        <div>
                            <label className="block text-xs font-bold text-discord-500 uppercase tracking-wider mb-2">Bot Token</label>
                            <div className="flex gap-2">
                                <input 
                                    type="password" 
                                    placeholder="Enter your Bot Token here..." 
                                    className="flex-1 bg-discord-900 text-white rounded p-3 focus:outline-none focus:ring-2 focus:ring-discord-accent border border-discord-800"
                                    defaultValue="*****************************************"
                                />
                                <button className="bg-discord-800 hover:bg-discord-700 px-4 rounded text-white font-medium">Reveal</button>
                            </div>
                            <p className="text-xs text-red-400 mt-1">Never share your token with anyone!</p>
                        </div>
                        
                        <div>
                            <label className="block text-xs font-bold text-discord-500 uppercase tracking-wider mb-2">Client ID</label>
                            <input 
                                type="text" 
                                placeholder="Enter Client ID..." 
                                className="w-full bg-discord-900 text-white rounded p-3 focus:outline-none focus:ring-2 focus:ring-discord-accent border border-discord-800"
                            />
                        </div>

                        <div>
                            <label className="block text-xs font-bold text-discord-500 uppercase tracking-wider mb-2">Client Secret</label>
                            <input 
                                type="password" 
                                placeholder="Enter Client Secret..." 
                                className="w-full bg-discord-900 text-white rounded p-3 focus:outline-none focus:ring-2 focus:ring-discord-accent border border-discord-800"
                            />
                        </div>

                        <div className="border-t border-discord-800 pt-6 mt-6">
                            <label className="block text-xs font-bold text-discord-500 uppercase tracking-wider mb-2">Command Prefix</label>
                            <input 
                                type="text" 
                                defaultValue="!" 
                                className="w-24 bg-discord-900 text-white rounded p-3 focus:outline-none focus:ring-2 focus:ring-discord-accent border border-discord-800 text-center text-lg"
                            />
                        </div>

                        <div className="flex justify-end gap-3 mt-8">
                            <button className="text-white hover:underline px-4 py-2 rounded">Cancel</button>
                            <button className="bg-discord-accent hover:bg-discord-accentHover text-white px-6 py-2 rounded font-medium transition">Save Changes</button>
                        </div>
                    </form>
                </Card>
            </div>
        );

        const App = () => {
            const [activeTab, setActiveTab] = useState('overview');
            const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
            
            const [isAuthenticated, setIsAuthenticated] = useState(false);
            const [authCode, setAuthCode] = useState(null);

            useEffect(() => {
                // Prüft ob ein Code von Discord in der URL übergeben wurde
                const urlParams = new URLSearchParams(window.location.search);
                const code = urlParams.get('code');
                
                if (code) {
                    setAuthCode(code);
                    setIsAuthenticated(true);
                    
                    // Bereinigt die URL optisch, ohne die Seite neu zu laden
                    window.history.replaceState({}, document.title, window.location.pathname);
                }
            }, []);

            useEffect(() => {
                lucide.createIcons();
            }, [activeTab, isAuthenticated]);

            const navItems = [
                { id: 'overview', label: 'Overview', icon: 'layout-dashboard' },
                { id: 'modules', label: 'Modules', icon: 'blocks' },
                { id: 'settings', label: 'Settings', icon: 'settings' },
            ];

            const renderContent = () => {
                switch(activeTab) {
                    case 'overview': return <OverviewPage />;
                    case 'modules': return <ModulesPage />;
                    case 'settings': return <SettingsPage />;
                    default: return <OverviewPage />;
                }
            };

            if (!isAuthenticated) {
                return <LoginPage />;
            }

            return (
                <div className="flex h-screen bg-discord-bg overflow-hidden">
                    {/* Sidebar */}
                    <aside className={`bg-discord-sidebar w-64 flex-shrink-0 flex flex-col transition-transform duration-300 z-20 ${isMobileMenuOpen ? 'translate-x-0 absolute inset-y-0 left-0' : '-translate-x-full md:translate-x-0'} md:relative`}>
                        <div className="h-16 flex items-center px-6 border-b border-discord-800 flex-shrink-0">
                            <div className="w-8 h-8 bg-discord-accent rounded-lg flex items-center justify-center mr-3">
                                <i data-lucide="bot" className="text-white"></i>
                            </div>
                            <h1 className="text-white font-bold text-lg">Bot Control</h1>
                            {/* Close button for mobile */}
                            <button className="md:hidden ml-auto text-discord-500 hover:text-white" onClick={() => setIsMobileMenuOpen(false)}>
                                <i data-lucide="x"></i>
                            </button>
                        </div>
                        
                        <div className="flex-1 overflow-y-auto py-4">
                            <nav className="space-y-1 px-3">
                                {navItems.map(item => (
                                    <button
                                        key={item.id}
                                        onClick={() => {
                                            setActiveTab(item.id);
                                            setIsMobileMenuOpen(false);
                                        }}
                                        className={`w-full flex items-center px-3 py-2.5 text-sm font-medium rounded-md transition-colors ${
                                            activeTab === item.id 
                                                ? 'bg-discord-800 text-white' 
                                                : 'text-discord-500 hover:bg-discord-800/50 hover:text-gray-300'
                                        }`}
                                    >
                                        <i data-lucide={item.icon} className="mr-3 w-5 h-5"></i>
                                        {item.label}
                                    </button>
                                ))}
                            </nav>
                        </div>

                        <div className="p-4 bg-discord-900 border-t border-discord-800">
                            <div className="flex items-center">
                                <div className="w-10 h-10 rounded-full bg-discord-800 flex items-center justify-center text-white">
                                    <i data-lucide="user" className="w-5 h-5"></i>
                                </div>
                                <div className="ml-3">
                                    <p className="text-sm font-medium text-white">Verbunden</p>
                                    <p className="text-xs text-discord-500">via OAuth2</p>
                                </div>
                                <button 
                                    className="ml-auto text-discord-500 hover:text-white transition-colors"
                                    title="Abmelden"
                                    onClick={() => {
                                        setIsAuthenticated(false);
                                        setAuthCode(null);
                                    }}
                                >
                                    <i data-lucide="log-out" className="w-5 h-5"></i>
                                </button>
                            </div>
                        </div>
                    </aside>

                    {/* Main Content Area */}
                    <div className="flex-1 flex flex-col min-w-0 bg-discord-bg relative">
                        {/* Mobile Header */}
                        <header className="md:hidden h-16 bg-discord-sidebar border-b border-discord-800 flex items-center justify-between px-4">
                            <h1 className="text-white font-bold">Bot Control</h1>
                            <button className="text-discord-500 hover:text-white" onClick={() => setIsMobileMenuOpen(true)}>
                                <i data-lucide="menu"></i>
                            </button>
                        </header>

                        {/* Main Content scrollable area */}
                        <main className="flex-1 overflow-y-auto p-6 md:p-8">
                            <div className="max-w-6xl mx-auto">
                                {renderContent()}
                            </div>
                        </main>
                    </div>

                    {/* Overlay for mobile sidebar */}
                    {isMobileMenuOpen && (
                        <div 
                            className="fixed inset-0 bg-black/50 z-10 md:hidden"
                            onClick={() => setIsMobileMenuOpen(false)}
                        ></div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
